{% extends 'main/layout.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<style>
    .auth-form {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background: rgba(20,20,50,0.7);
        border-radius: 20px;
        border: 1px solid rgba(255,215,0,0.3);
    }

        .auth-form h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }

            .auth-form input:focus {
                outline: none;
                border-color: #ffd700;
                box-shadow: 0 0 10px rgba(255,215,0,0.3);
            }

        .auth-form button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            font-size: 16px;
        }

            .auth-form button:hover {
                transform: scale(1.02);
                box-shadow: 0 0 15px rgba(255,215,0,0.5);
            }

    .auth-link {
        text-align: center;
        margin-top: 20px;
    }

        .auth-link a {
            color: #ffd700;
            text-decoration: none;
        }

            .auth-link a:hover {
                text-decoration: underline;
            }

    .auth-form label {
        color: #ddd !important;
        font-size: 14px;
        margin-top: 10px;
        display: block;
    }

    .errorlist {
        color: #ff8888 !important;
        font-size: 12px;
        list-style: none;
        padding-left: 0;
    }
</style>

<div class="auth-form">
    <h2>🔐 ВХОД В АККАУНТ</h2>
    <form method="post">
        {% csrf_token %}
        <label>Email</label>
        {{ form.username }}
        <label>Пароль</label>
        {{ form.password }}
        <button type="submit">Войти</button>
    </form>
    <div class="auth-link">
        <a href="{% url 'register' %}">Нет аккаунта? Зарегистрироваться</a>
    </div>
</div>
{% endblock %}
