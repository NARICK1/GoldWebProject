{% extends 'main/layout.html' %}

{% block title %}{{title}}{%endblock%}

{% block content %}

<div class="feature">

    <h1>{{ title }}</h1>

    <p>Что-то интересное</p>

    <button class="btn btn-warning">Нажми на меня</button>

    {% if new_object%}

    {% for obj in new_object%}

    <div class="alert alert-warning">
        <h3>{{ obj.comment}}</h3>
        <p>{{ obj.full_text}}</p>
        <p>{{ obj.date }}</p>
    </div>

    {%endfor%}

    {%else%}

    <p>Нет записей</p>
    {%endif%}

</div>

{%endblock%}
