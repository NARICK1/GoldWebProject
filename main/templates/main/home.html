{% extends 'main/layout.html' %}

{% block title %}CosmoRing{% endblock %}

{% block content %}
<div id="three-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"></div>

<div style="position: relative; z-index: 10; color: white; text-align: center; padding: 50px; margin-left: 260px;">
    <h1 style="color: #ffd700;">🌀 Интернет магазин CosmoRing</h1>
    <p>Коллекция Бесконечность уже в каталоге!</p>
</div>

<script>
    // Определяем тему
    const isLightTheme = document.body.classList.contains('light-theme');

    if (isLightTheme) {
        // При светлой теме показываем светлую статичную картинку вместо 3D
        const canvas = document.getElementById('three-canvas');
        if (canvas) {
            canvas.style.background = 'linear-gradient(135deg, #fff9f5 0%, #f5f0ff 50%, #f0f5ff 100%)';
            canvas.innerHTML = '<div style="display: flex; justify-content: center; align-items: center; height: 100%; font-size: 80px; opacity: 0.3;">✨</div>';
        }
    } else {
        // запускаем 3D чёрную дыру
       
    }
</script>
{% endblock %}
