{% extends 'main/layout.html' %}

{% block title %}Черная дыра{% endblock %}

{% block content %}
<div id="three-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"></div>

<div style="position: relative; z-index: 10; color: white; text-align: center; padding: 50px; margin-left: 260px;">
    <h1 style="color: #ffd700;">🌀 Интернет магазин CosmoRing</h1>
    <p>Коллекция Бесконечность уже в каталоге!</p>
</div>
{% endblock %}

{% block extra_scripts %}
<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010118);
    scene.fog = new THREE.FogExp2(0x010118, 0.0003);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3.5, 16);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.getElementById('three-canvas').appendChild(renderer.domElement);

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.3, 0.4, 0.85);
    bloomPass.threshold = 0.05;
    bloomPass.strength = 0.7;
    bloomPass.radius = 0.6;
    const effectComposer = new EffectComposer(renderer);
    effectComposer.addPass(renderScene);
    effectComposer.addPass(bloomPass);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.target.set(0, 0, 0);
    controls.enableZoom = true;
    controls.zoomSpeed = 1.0;
    controls.minDistance = 3;   // Минимальное расстояние (близко к дыре)
    controls.maxDistance = 40;  // Максимальное расстояние (дальше нельзя улететь)

    // Звезды
    const starCount = 8000;
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        const radius = 90 + Math.random() * 80;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
        starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
        starPositions[i * 3 + 2] = radius * Math.cos(phi);

        const colorType = Math.random();
        if (colorType < 0.7) {
            starColors[i * 3] = 1;
            starColors[i * 3 + 1] = 1;
            starColors[i * 3 + 2] = 1;
        } else if (colorType < 0.85) {
            starColors[i * 3] = 0.6;
            starColors[i * 3 + 1] = 0.7;
            starColors[i * 3 + 2] = 1;
        } else {
            starColors[i * 3] = 1;
            starColors[i * 3 + 1] = 0.6;
            starColors[i * 3 + 2] = 0.4;
        }
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
    const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ size: 0.16, vertexColors: true, transparent: true, opacity: 0.9 }));
    scene.add(stars);

    const starGeometry2 = new THREE.BufferGeometry();
    const starPositions2 = new Float32Array(5000 * 3);
    for (let i = 0; i < 5000; i++) {
        starPositions2[i * 3] = (Math.random() - 0.5) * 450;
        starPositions2[i * 3 + 1] = (Math.random() - 0.5) * 250;
        starPositions2[i * 3 + 2] = (Math.random() - 0.5) * 200 - 100;
    }
    starGeometry2.setAttribute('position', new THREE.BufferAttribute(starPositions2, 3));
    const stars2 = new THREE.Points(starGeometry2, new THREE.PointsMaterial({ color: 0x88aaff, size: 0.07, transparent: true, opacity: 0.5 }));
    scene.add(stars2);

    // Черная дыра
    const blackHoleCore = new THREE.Mesh(
        new THREE.SphereGeometry(1.35, 128, 128),
        new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x220000, emissiveIntensity: 0.2, metalness: 0.95, roughness: 0.15 })
    );
    scene.add(blackHoleCore);

    // Аккреционный диск
    const createUnifiedDisk = () => {
        const innerRadius = 1.45;
        const outerRadius = 6.2;
        const segments = 256;

        const vertices = [];
        const indices = [];
        const uvs = [];

        for (let i = 0; i <= segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);

            vertices.push(cosA * innerRadius, 0.03, sinA * innerRadius);
            uvs.push(i / segments, 0);

            vertices.push(cosA * outerRadius, 0.05, sinA * outerRadius);
            uvs.push(i / segments, 1);
        }

        for (let i = 0; i < segments; i++) {
            const base = i * 2;
            indices.push(base, base + 1, base + 2);
            indices.push(base + 1, base + 3, base + 2);
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertices), 3));
        geometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
        geometry.setIndex(indices);

        const material = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 } },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;

                void main() {
                    float r = vUv.y;
                    vec3 colorInner = vec3(1.0, 0.9, 0.5);
                    vec3 colorMid = vec3(1.0, 0.55, 0.15);
                    vec3 colorOuter = vec3(0.85, 0.2, 0.05);
                    vec3 color;
                    if (r < 0.35) {
                        color = mix(colorInner, colorMid, r / 0.35);
                    } else {
                        color = mix(colorMid, colorOuter, (r - 0.35) / 0.65);
                    }
                    float brightness = 1.1 * (1.0 - r * 0.5);
                    float doppler = 0.75 + sin(vUv.x * 12.566 + uTime * 10.0) * 0.25;
                    float pulse = 0.9 + sin(uTime * 3.0) * 0.08;
                    float alpha = 0.9 * (1.0 - r * 0.2);
                    gl_FragColor = vec4(color * brightness * doppler * pulse, alpha);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide
        });

        return new THREE.Mesh(geometry, material);
    };

    const unifiedDisk = createUnifiedDisk();
    scene.add(unifiedDisk);

    // Тонкие кольца
    const thinRing1 = new THREE.Mesh(
        new THREE.TorusGeometry(2.0, 0.045, 128, 400),
        new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: 0xff6622, emissiveIntensity: 0.8 })
    );
    thinRing1.rotation.x = Math.PI / 2;
    scene.add(thinRing1);

    const thinRing2 = new THREE.Mesh(
        new THREE.TorusGeometry(3.0, 0.04, 128, 400),
        new THREE.MeshStandardMaterial({ color: 0xffcc66, emissive: 0xff4422, emissiveIntensity: 0.6 })
    );
    thinRing2.rotation.x = Math.PI / 2;
    scene.add(thinRing2);

    // Частицы
    const particleCount = 6000;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
        const r = 1.8 + Math.random() * 4.5;
        const angle = Math.random() * Math.PI * 2;
        const yOff = (Math.random() - 0.5) * 0.25;
        particlePositions[i * 3] = Math.cos(angle) * r;
        particlePositions[i * 3 + 1] = yOff;
        particlePositions[i * 3 + 2] = Math.sin(angle) * r;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const diskParticles = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0xffaa66, size: 0.035, transparent: true, blending: THREE.AdditiveBlending }));
    scene.add(diskParticles);

    // Свет
    const mainLight = new THREE.PointLight(0xffaa55, 1.0, 35);
    mainLight.position.set(2, 2, 4);
    scene.add(mainLight);

    const fillLight = new THREE.AmbientLight(0x111122);
    scene.add(fillLight);

    // Анимация
    let time = 0;

    function animate() {
        requestAnimationFrame(animate);
        time += 0.014;

        unifiedDisk.rotation.y += 0.012;
        if (unifiedDisk.material.uniforms) unifiedDisk.material.uniforms.uTime.value = time;

        thinRing1.rotation.z += 0.01;
        thinRing2.rotation.z -= 0.008;
        diskParticles.rotation.y += 0.01;

        stars.rotation.y += 0.0002;
        stars.rotation.x += 0.0001;
        stars2.rotation.y -= 0.00015;

        const intensity = 0.9 + Math.sin(time * 2.5) * 0.2;
        mainLight.intensity = intensity;

        controls.update();
        effectComposer.render();
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        effectComposer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log("✨ Чёрная дыра загружена! йоу ✨");
</script>
{% endblock %}
